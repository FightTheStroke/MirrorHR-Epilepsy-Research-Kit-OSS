# By default, SwiftLint uses a set of sensible default rules you can adjust:
disabled_rules: # rule identifiers turned on by default to exclude from running
  - colon
  - comma
  - control_statement
  - trailing_whitespace
  - identifier_name
  - vertical_parameter_alignment
  - function_body_length
  # Add more rules here if they are not practical to fix immediately
  - file_length
  - type_body_length
  - line_length
  - force_cast
  - force_try
  - cyclomatic_complexity
  - todo
  - fixme
  - legacy_objc_type
  - legacy_constructor
  - large_tuple
  - closure_body_length
  - function_parameter_count
  - nesting
  - opening_brace
  - redundant_optional_initialization
  - redundant_string_enum_value
  - redundant_void_return
  - return_arrow_whitespace
  - statement_position
  - switch_case_on_newline
  - unneeded_parentheses_in_closure_argument
  - unused_closure_parameter
  - vertical_whitespace_between_cases
  - weak_delegate

opt_in_rules: # some rules are turned off by default, so you need to opt-in
  - empty_count # Find all the available rules by running: `swiftlint rules`

# Alternatively, specify all rules explicitly by uncommenting this option:
# only_rules: # delete `disabled_rules` & `opt_in_rules` if using this
#   - empty_parameters
#   - vertical_whitespace

# Only lint the main app source directories
included:
  - MirrorHRKit/Sources
  - MirrorHRWidget
  - Epilepsy Research Kit WatchKit Extension

excluded: # paths to ignore during linting. Takes precedence over `included`.
  - Carthage
  - Pods
  - .build
  - build
  - checkouts
  - DerivedData
  - fastlane
  - Packages
  - MirrorHRKit/.build
  - MirrorHRKit/build
  - MirrorHRKit/Tests
  - MirrorHRWidget/Tests
  - **/Tests
  - test_data
  - Experiments-Learnings
  - Documentation
  - docs
  - .github
  - .vscode
  - .cursor

analyzer_rules: # Rules run by `swiftlint analyze`
  - explicit_self

# configurable rules can be customized from this configuration file
# binary rules can set their severity level
force_cast: warning # implicitly
force_try:
  severity: warning # explicitly
# rules that have both warning and error levels, can set just the warning level
# implicitly
line_length: 300
# they can set both implicitly with an array
type_body_length:
  - 300 # warning
  - 400 # error
# or they can set both explicitly
file_length:
  warning: 700
  error: 1200
# naming rules can set warnings/errors for min_length and max_length
# additionally they can set excluded names
type_name:
  min_length: 3 # only warning
  max_length: # warning and error
    warning: 40
    error: 50
  excluded: iPhone # excluded via string
  allowed_symbols: ["_"] # these are allowed in type names
identifier_name:
  min_length: # only min_length
    error: 2 # only error
  excluded: # excluded via string array
    - id
    - URL
    - GlobalAPIKey
reporter: "xcode" # reporter type (xcode, json, csv, checkstyle, codeclimate, junit, html, emoji, sonarqube, markdown, github-actions-logging)

# NOTE: This configuration is intentionally strict about what is linted and disables rules that are not practical to fix immediately. Please see CONTRIBUTING.md for the plan to gradually improve code style and re-enable rules over time.